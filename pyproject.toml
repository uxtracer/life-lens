[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "life_lens"
version = "0.1.0"
description = "本地相册结构化记忆库 — 把整本相册转成 LLM 可查询的结构化文本"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "pillow-heif>=0.15",
    "piexif>=1.1.3",
    "requests>=2.31",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
vision = []
faces = ["onnxruntime>=1.17", "insightface>=0.7"]
apple = ["osxphotos>=0.60,<0.65"]   # 0.65+ uses runtime `X | None` syntax (Py 3.10+),会在 Py 3.9 import 时 TypeError
semantic = ["fastembed>=0.4", "httpx[socks]"]
mcp = ["mcp>=0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
lens = "life_lens.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["life_lens*"]
